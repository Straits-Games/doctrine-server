[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doctrine-server"
dynamic = ["version"]
description = "Self-hostable dedicated server (turn relay + game list) for Doctrine: Squad-Based Tactics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Straits Games LLC", email = "info@straitsgames.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
dev = ["pytest>=8"]

[project.scripts]
doctrine-server = "doctrine_server.cli:main"

[tool.setuptools.dynamic]
version = { attr = "doctrine_server.__version__" }

[tool.setuptools.packages.find]
include = ["doctrine_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # newer Starlette prefers httpx2 for its TestClient; httpx still works
    "ignore:Using `httpx` with `starlette.testclient`",
]
